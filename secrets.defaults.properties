# Template for secrets.properties (gitignored, per-developer local values).
#
# Local dev: copy this file to secrets.properties at the repo root and fill in
# real values there - it is never committed.
#
# CI (GitHub Actions): set the same key names as repository/environment
# secrets and expose them to the build step via `env:` - no file needed,
# secretProperty() in app/build.gradle.kts checks environment variables first.

EXAMPLE_API_KEY=replace-with-a-real-value-locally

# Espresso login test fixture (LoginActivityTest). These defaults match what
# was previously hardcoded in the test - override here or via env var if the
# test account ever changes (e.g. to a real QA account).
TEST_LOGIN_EMAIL=henry@example.com
TEST_LOGIN_PASSWORD=password123
