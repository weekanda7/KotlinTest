name: androidTest

on:
  push:
  pull_request:
  # Manual run from the Actions tab ("Run workflow"). Every filter is optional; leave them
  # all empty to run the whole suite. They map 1:1 onto the Makefile's test filters (see
  # `make help`), which hand them to AndroidJUnitRunner. Filters combine as AND.
  workflow_dispatch:
    inputs:
      device:
        description: Which managed device(s) to run on
        type: choice
        default: all
        options: [all, pixel8api30atd, pixel8api33atd]
      mark:
        description: 'MARK - only tests with this mark (marks/Marks.kt)'
        type: choice
        default: none
        options: [none, Smoke, Regression, Critical, High, Medium, Low]
      test:
        description: 'TEST - Class or Class#method under cases/, comma-separated (e.g. login.LoginActivityTest#login_withInvalidEmail_showsEmailError)'
        type: string
      package:
        description: 'PKG - package under cases/ (e.g. device)'
        type: string
      exclude:
        description: 'EXCLUDE - Class or Class#method to skip, same format as TEST'
        type: string
      not_mark:
        description: 'NOT_MARK - skip tests with any of these marks, comma-separated (e.g. Low,Medium)'
        type: string
      k:
        description: 'K - regex on pkg.Class#method (e.g. .*withEmpty.*)'
        type: string

# A newer push to the same branch/PR cancels the run that is still going. Manual runs get
# a group of their own (run_id), so they never cancel - or get cancelled by - another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# Where the hosted Ubuntu image keeps its Android SDK (ANDROID_HOME on the runner).
env:
  SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  gmd:
    # Pinned on purpose: ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748). libpulse0 and the disk cleanup below are 24.04 facts;
    # re-validate them before switching the label.
    runs-on: ubuntu-24.04
    # A wedged emulator boot would otherwise burn the 6-hour default.
    timeout-minutes: 45
    # One managed device per runner. The emulator wants ~7.4 GB free next to every AVD it
    # boots ("Not enough space to create userdata partition ... need 7372.80 MB"), so two
    # devices on one runner would fight over the same few GB; two runners also finish in
    # parallel instead of one after the other. The `ci` group in app/build.gradle.kts stays
    # for local runs (make gmdCi). ATD images only - see the note on the devices in
    # app/build.gradle.kts for why the full API 37 google image was dropped.
    strategy:
      fail-fast: false
      # Both devices on push/PR; a manual run can pick one. (A plain `include:` list can't be
      # filtered this way - an include entry that matches no combination is added back as a
      # new one - so the device list is computed and the system image looked up below.)
      matrix:
        device: ${{ fromJSON(inputs.device && inputs.device != 'all' && format('["{0}"]', inputs.device) || '["pixel8api30atd","pixel8api33atd"]') }}
    name: ${{ matrix.device }}
    env:
      # System image each managed device boots - keep in sync with app/build.gradle.kts.
      SYSTEM_IMAGE: ${{ fromJSON('{"pixel8api30atd":"system-images;android-30;aosp_atd;x86_64","pixel8api33atd":"system-images;android-33;aosp_atd;x86_64"}')[matrix.device] }}
    steps:
      - uses: actions/checkout@v7

      # Hosted Linux runners expose /dev/kvm, but only root may open it until this rule runs.
      # Without it the emulator falls back to software virtualization and boot takes forever.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The 24.04 image leaves only a few GB on / once the emulator and a system image are
      # installed, and the emulator refuses to create an AVD's userdata partition with less
      # than ~7.4 GB free. Toolchains this job never touches go; the Android SDK, the JDKs
      # and everything under /opt/hostedtoolcache except CodeQL stay.
      - name: Free disk space
        run: |
          echo "before: $(df -h / | tail -n 1)"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/share/rust \
            /usr/share/miniconda \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/julia* \
            /usr/lib/google-cloud-sdk \
            /opt/az \
            /opt/microsoft \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "after:  $(df -h / | tail -n 1)"

      # Ubuntu 24.04 runner images no longer ship libpulse0, and the emulator's qemu binary is
      # linked against libpulse.so.0 - without it `emulator -version` dies with "error while
      # loading shared libraries" (lower-case, so GMD's ERROR filter never shows it).
      - name: Install host libraries the emulator needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0

      # The emulator (~300 MB) and the system image (~1-3 GB) are not on the runner image.
      # Restore them from cache when nothing about this device changed; the sdkmanager step
      # below is then a no-op. (~/.config/.android/avd/gradle-managed - where AGP puts its
      # AVDs on this runner, because sdklib honours XDG_CONFIG_HOME - is deliberately NOT
      # cached: a snapshot is only valid for the exact emulator build that made it.)
      - name: Cache emulator + system image
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: android-sdk-gmd-${{ runner.os }}-${{ matrix.device }}-${{ hashFiles('app/build.gradle.kts', '.github/workflows/androidTest.yml') }}

      # Install what this device needs BEFORE Gradle starts, so the <device>Setup task has
      # nothing to download (on a cold runner two setup tasks once raced on installing the
      # same "emulator" package). Runs before setup-java on purpose, so sdkmanager uses the
      # runner's default JDK 17. The two -version calls prove both emulator engines load:
      # the windowed one (needs libpulse0) and the headless one -no-window selects, which is
      # what GMD actually runs.
      - name: Install emulator + system image up front
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "emulator" "$SYSTEM_IMAGE"
          "$SDK_ROOT/emulator/emulator" -version | head -n 3 || echo "::warning::windowed emulator engine failed to load"
          "$SDK_ROOT/emulator/emulator" -no-window -version | head -n 3 || echo "::warning::headless emulator engine failed to load"
          echo "free on / after SDK install: $(df -h / | tail -n 1)"

      # Same major as gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle
      # picks this JDK for the daemon instead of provisioning a second one via foojay.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Caches the Gradle user home (wrapper dist, dependency cache) between runs.
      - uses: gradle/actions/setup-gradle@v6

      # swiftshader_indirect: software GPU - hosted runners have none (from the GMD docs).
      # The login fixture secrets are optional: secretProperty() in app/build.gradle.kts treats
      # an empty env var as "not provided" and falls back to secrets.defaults.properties.
      # If an emulator ever refuses to start again ("Unable to start Android emulator ...
      # Error message from emulator process = []" says nothing by itself), re-run with
      # `--debug 2>&1 | tee gradle-debug.log`: AGP's AvdManager logs the emulator's own
      # output at debug level, and the runner-side checks are `df -h`, `ls -l /dev/kvm`,
      # `emulator -accel-check` and the two -version calls above.
      # The test filters reach make as environment variables (make reads TEST, MARK, ... from
      # the environment through their `?=` defaults) instead of being pasted into the script,
      # so free-text inputs are never interpreted by this step's shell. On push/PR they are
      # all empty and the whole suite runs.
      - name: Run instrumented tests on ${{ matrix.device }}
        run: |
          {
            echo "### ${{ matrix.device }}"
            echo '```'
            make -n gmd | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          make gmd
        env:
          DEVICE: ${{ matrix.device }}
          GRADLE_ARGS: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          TEST: ${{ inputs.test }}
          PKG: ${{ inputs.package }}
          EXCLUDE: ${{ inputs.exclude }}
          MARK: ${{ inputs.mark != 'none' && inputs.mark || '' }}
          NOT_MARK: ${{ inputs.not_mark }}
          K: ${{ inputs.k }}
          TEST_LOGIN_EMAIL: ${{ secrets.TEST_LOGIN_EMAIL }}
          TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports-${{ matrix.device }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
