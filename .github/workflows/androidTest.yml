name: androidTest

on: [push, pull_request]

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Where the hosted Ubuntu image keeps its Android SDK (ANDROID_HOME on the runner).
env:
  SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  gmd:
    runs-on: ubuntu-latest
    # A wedged emulator boot would otherwise burn the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Hosted Linux runners expose /dev/kvm, but only root may open it until this rule runs.
      # Without it the emulator falls back to software virtualization and boot takes forever.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Ubuntu 24.04 runner images no longer ship libpulse0, and the emulator's qemu binary is
      # linked against libpulse.so.0 - without it `emulator -version` dies with "error while
      # loading shared libraries" (lower-case, so GMD's ERROR filter never shows it).
      - name: Install host libraries the emulator needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0

      # The emulator (~300 MB) and the system images (~1 GB each) are not on the runner image.
      # Restore them from cache when nothing about the devices changed; the sdkmanager step
      # below is then a no-op. (~/.android/avd/gradle-managed is deliberately NOT cached: a
      # snapshot is only valid for the exact emulator build that made it, and AGP discards
      # and re-creates it anyway when they differ.)
      - name: Cache emulator + system images
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: android-sdk-gmd-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', '.github/workflows/androidTest.yml') }}

      # Install everything the two managed devices need BEFORE Gradle starts. With the
      # configuration cache on, Gradle runs the two <device>Setup tasks in parallel, and on a
      # cold runner they both tried to install the same "emulator" package at once - one of
      # them lost the race ("Failed to install ... emulator") and the other booted a half-
      # installed emulator ("Unable to start Android emulator ... = []"). Pre-installing
      # leaves the setup tasks nothing to download or race on. Package names must match the
      # devices in app/build.gradle.kts (x86_64 because the runner is x86_64).
      # Runs before setup-java on purpose, so sdkmanager uses the runner's default JDK 17.
      - name: Install emulator + system images up front
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "emulator" \
            "system-images;android-33;aosp_atd;x86_64" \
            "system-images;android-37.0;google_apis;x86_64"
          # Both engines must at least load: the windowed one (needs libpulse0) and the
          # headless one that -no-window selects, which is what GMD actually runs.
          "$SDK_ROOT/emulator/emulator" -version | head -n 3 || echo "::warning::windowed emulator engine failed to load"
          "$SDK_ROOT/emulator/emulator" -no-window -version | head -n 3 || echo "::warning::headless emulator engine failed to load"

      # Same major as gradle/gradle-daemon-jvm.properties (toolchainVersion=25), so Gradle
      # picks this JDK for the daemon instead of provisioning a second one via foojay.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Caches the Gradle user home (wrapper dist, dependency cache) between runs.
      - uses: gradle/actions/setup-gradle@v6

      # --max-workers=1: the configuration cache lets Gradle run independent tasks of the same
      #   module in parallel, which here means two emulators cold-booting (and then running
      #   tests) at the same time on a 4-vCPU runner. Serialising them costs nothing on a
      #   project this small and removes a whole class of "device setup failed" flakes.
      # swiftshader_indirect: software GPU - hosted runners have none (from the GMD docs).
      # The login fixture secrets are optional: secretProperty() in app/build.gradle.kts treats
      # an empty env var as "not provided" and falls back to secrets.defaults.properties.
      # --continue: if one device fails to boot, still set up and run the other one, so a
      #   single run tells us whether the problem is device-specific (ATD vs google image).
      # --debug: AvdSnapshotHandler logs every line the emulator prints at debug level and
      #   surfaces only the ones containing "ERROR", so this is the only way to see why an
      #   emulator died. The full log goes to a file (uploaded below); the console keeps
      #   the normal lifecycle/warning/error lines only.
      - name: Run instrumented tests on Gradle-managed devices
        run: |
          set -o pipefail
          ./gradlew ciGroupDebugAndroidTest \
            --continue \
            --max-workers=1 \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --debug 2>&1 | tee gradle-debug.log | grep -E '\[(LIFECYCLE|WARN|ERROR|QUIET)\]'
        env:
          TEST_LOGIN_EMAIL: ${{ secrets.TEST_LOGIN_EMAIL }}
          TEST_LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}

      # What the emulator itself said during GMD's own launches (from the debug log), then a
      # by-hand launch with GMD's flags so the tail of the boot is visible even if GMD deleted
      # its AVD on failure (it did last time: ~/.android/avd/gradle-managed was gone).
      - name: Emulator diagnostics
        if: failure()
        run: |
          echo "==== emulator output captured by GMD (AvdSnapshotHandler, last 300 lines) ===="
          grep -F 'AvdSnapshotHandler' gradle-debug.log | tail -n 300 || echo "(no AvdSnapshotHandler lines in gradle-debug.log)"
          set -x
          ls -l /dev/kvm || true
          EMU="$SDK_ROOT/emulator/emulator"
          "$EMU" -accel-check || true
          find "$HOME/.android" -maxdepth 4 \( -name '*.ini' -o -name '*.avd' \) 2>/dev/null || true
          GMD_INI="$(find "$HOME/.android" -maxdepth 4 -name 'dev*.ini' 2>/dev/null | head -n 1 || true)"
          if [ -n "$GMD_INI" ]; then
            export ANDROID_AVD_HOME="$(dirname "$GMD_INI")"
            AVD="$(basename "$GMD_INI" .ini)"
            cat "$ANDROID_AVD_HOME/$AVD.avd/config.ini" || true
          else
            echo "GMD left no AVD behind - creating a throwaway one from the same ATD image"
            AVDMANAGER="$(command -v avdmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/avdmanager | head -n 1)"
            echo no | "$AVDMANAGER" create avd -n diag -k "system-images;android-33;aosp_atd;x86_64" --force
            AVD=diag
            ls -la "$HOME/.android/avd" || true
          fi
          echo "==== booting @$AVD by hand with GMD's flags (150 s cap) ===="
          timeout 150 "$EMU" "@$AVD" -no-window -no-boot-anim -no-audio -gpu swiftshader_indirect -no-snapshot-load -verbose -show-kernel 2>&1 | tail -n 250 || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            gradle-debug.log
